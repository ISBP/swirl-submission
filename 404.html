<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Looks like you got lost!</title>
    <link rel="stylesheet" href="css/style.css">
    <meta name="description" content="">
    <link rel="apple-touch-icon" sizes="180x180" href="img/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="img/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="img/icons/favicon-16x16.png">
    <link rel="manifest" href="img/icons/site.webmanifest">
    <style>

        @import "https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap";

        @keyframes EVILColor {
            from {color: black;}
            to {color: red;}
        }
        body{
            background-color: black;
        }
        .main{
            background-color: white;
            width: 50vw;
            text-align: center;
            color: black;
            font-size: 30px;
            justify-content: center;
            margin: 0;
            position: absolute;
            top: 50%;
            left: 50%;
            -ms-transform: translate(-50%, -50%);
            transform: translate(-50%, -50%);
            animation-name: EVILColor;
            animation-duration: 4s;
            animation-iteration-count: infinite;
            a{
                color: gray;
            }
            a:hover{
                color: darkgray;
            }
            .button {
                background-color: black;
                border: none;
                color: white;
                padding: 15px 32px;
                text-align: center;
                text-decoration: none;
                display: inline-block;
                font-size: 16px;
                font-family: endless, serif;
                cursor: pointer;
            }
        }
    </style>
    <meta name="theme-color" content="#fafafa">
</head>
<body>
<div class="main">
    <h1>404 - Page not found!</h1>
        <button  onclick="location.href='/'" class="button">Go home?</button>
    <ul>
        <li><p><a href="/contact">Contact Me</a></p></li>
        <li><p><a href="/projects">Projects</a></p></li>
        <li><p><a href="https://github.com/isbp">Github</a></p></li>
    </ul>

</div>

</body>
</html>
